[nosetests]
verbosity=2
with-spec=1
spec-color=1
with-coverage=1
cover-erase=1
cover-package=service

[coverage:run]
source = service

[coverage:report]
show_missing = True

[flake8]
max-line-length = 127
per-file-ignores =
    */__init__.py: F401 E402
exclude =
    .git,
    __pycache__,
    .venv,
    venv,
    tests

[pylint.MASTER]
ignore=venv,tests

[pylint.FORMAT]
max-line-length=127

[pylint.MESSAGES CONTROL]
disable=
    C0114, # missing-module-docstring
    C0115, # missing-class-docstring
    C0116, # missing-function-docstring
    E1101, # no-member
    W0613  # unused-argument
