name: CI Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # Requirement 1: Step for checking out the code
    - name: Checkout code
      uses: actions/checkout@v3

    # Set up Python environment
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'

    # Install dependencies
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    # Requirement 2: Step for linting the code after checkout
    - name: Lint code
      run: |
        flake8 service tests
        pylint service tests

    # Requirement 3: Step for executing unit tests using nosetests
    - name: Run unit tests
      run: |
        nosetests
